name: Code Check

on:
  push:
    branches: [ main, master ] # Change to your default branch name if different
  pull_request:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prettier:
    name: Prettier Format & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install Prettier
        run: npm install -g prettier
      - name: Run Prettier Write
        run: prettier --write .
      - name: Commit and push if changed
        if: github.event_name == 'push'
        run: |
          git diff --exit-code || (git config --global user.name 'github-actions[bot]' && git config --global user.email 'github-actions[bot]@users.noreply.github.com' && git commit -am "style: auto-format with prettier --write" && git push)
